name: CI/CD - Test & Deploy to Vercel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
    
    - name: 🔍 Kiểm tra cấu trúc file
      run: |
        echo "🔍 Kiểm tra các file quan trọng..."
        test -f index.html && echo "✅ index.html tồn tại" || { echo "❌ Thiếu index.html"; exit 1; }
        test -f css/style.css && echo "✅ style.css tồn tại" || echo "⚠️ Thiếu style.css"
        echo "📁 Danh sách file:"
        ls -la
    
    - name: 🔬 HTML Validation cơ bản
      run: |
        echo "🔬 Validate HTML..."
        grep -q "<!DOCTYPE html>" index.html && echo "✅ DOCTYPE đúng" || { echo "❌ Thiếu DOCTYPE"; exit 1; }
        grep -q "</html>" index.html && echo "✅ Thẻ html đóng đúng" || echo "⚠️ Thiếu thẻ đóng html"
    
    - name: 🚀 Deploy to Vercel
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
